<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكورسات والمشاريع الهندسية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="courses-container">

    <!-- 1. كورس التشطيبات - المكتب الفني -->
    <div class="course-card">
      <div class="card-content">
        <h3>التشطيبات - المكتب الفني</h3>
        <p>عرض وتحميل الملفات الخاصة بكورس التشطيبات والمكتب الفني</p>
      </div>
      <div class="card-actions">
        <!-- مسار ملف الـ PDF داخل فولدر pdf -->
        <a href="pdf/technical_office_finishes.pdf" target="_blank" class="btn btn-view">View course</a>
      </div>
    </div>

    <!-- 2. مشروع CAD Project (يحتوي على زري Villa و Frame بجانب View course) -->
    <div class="course-card">
      <div class="card-content">
        <h3>CAD Project</h3>
        <p>اختر المشروع المطلوب لعرض ملف الكاد / الـ PDF الخاص به</p>
      </div>
      <div class="card-actions action-buttons">
        <!-- زر View course الرئيسي إن وجد -->
        <a href="pdf/cad_main.pdf" target="_blank" class="btn btn-view">View course</a>
        
        <!-- زر مشروع الفيلا -->
        <a href="pdf/villa_project.pdf" target="_blank" class="btn btn-villa">Villa</a>
        
        <!-- زر مشروع الفريم -->
        <a href="pdf/frame_project.pdf" target="_blank" class="btn btn-frame">Frame</a>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
